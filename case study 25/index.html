<!DOCTYPE html>
<html>
<head>
	<title>Product Gallery</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>

	<h1>Product Gallery</h1>

	<div class="filters">
		<button onclick="filterProducts('all')">All</button>
		<button onclick="filterProducts('electronics')">Electronics</button>
		<button onclick="filterProducts('clothing')">Clothing</button>
		<button onclick="filterProducts('shoes')">Shoes</button>
	</div>

	<div class="gallery">

		<div class="product electronics">
			<h2>Headphones</h2>
			<p>₹1,500</p>
		</div>

		<div class="product clothing">
			<h2>T-Shirt</h2>
			<p>₹500</p>
		</div>

		<div class="product shoes">
			<h2>Running Shoes</h2>
			<p>₹2,000</p>
		</div>

		<div class="product electronics">
			<h2>Smart Watch</h2>
			<p>₹3,000</p>
		</div>

		<div class="product clothing">
			<h2>Jeans</h2>
			<p>₹1,200</p>
		</div>

		<div class="product shoes">
			<h2>Casual Shoes</h2>
			<p>₹1,500</p>
		</div>

	</div>

	<script src="script.js"></script>

</body>
</html>
