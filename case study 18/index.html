<!DOCTYPE html>
<html>
<head>
	<title>Random Paragraph Alignment</title>
</head>
<ul id="myList">
    <li>Machine learning</li>
    <li>Deep learning</li>
    <li>Data analytics</li>
    <li>Script</li>
</ul>

<button onclick="replaceScript()">Replace Script</button>
<button onclick="removeList()">Remove All</button>

<script src="script.js"></script>
<body>
	<p id="myParagraph">
		This paragraph will change its alignment randomly when you click the button.
	</p>

	<button onclick="changeAlignment()">Change Alignment</button>

	<script>
		function changeAlignment() {
			const alignments = ["left", "center", "right", "justify"];
			const randomAlignment = alignments[Math.floor(Math.random() * alignments.length)];
			document.getElementById("myParagraph").style.textAlign = randomAlignment;
		}
	</script>
</body>
</html>
